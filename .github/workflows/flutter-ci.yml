name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter quality gate (${{ matrix.flutter-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.32.8 is the declared floor; 3.47.6 is the development pin.
        flutter-version: ['3.32.8', '3.47.6']
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Resolve root dependencies
        run: flutter pub get --no-example

      # The example app requires Dart ^3.11.1, so it only resolves on the
      # latest lane.
      - name: Resolve example dependencies
        if: matrix.flutter-version == '3.47.6'
        working-directory: example
        run: flutter pub get

      - name: Resolve MCP package dependencies
        if: matrix.flutter-version == '3.47.6'
        working-directory: packages/sleuth_mcp
        run: dart pub get

      - name: Check formatting
        if: matrix.flutter-version == '3.47.6'
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test tool example/lib example/test
          packages/sleuth_mcp/lib packages/sleuth_mcp/test packages/sleuth_mcp/bin

      - name: Analyze package (floor)
        if: matrix.flutter-version != '3.47.6'
        run: flutter analyze lib test

      - name: Analyze
        if: matrix.flutter-version == '3.47.6'
        run: flutter analyze

      # The Dart 3.8 analyzer rejects the class, enum and mixin moves in
      # lib/fix_data.yaml, so only the latest lane runs the goldens.
      - name: Check dart fix data
        if: matrix.flutter-version == '3.47.6'
        run: dart fix test_fixes --compare-to-golden

      - name: Test
        run: flutter test --exclude-tags benchmark

      - name: Benchmarks (serial)
        run: flutter test --tags benchmark --concurrency=1

      - name: Test example
        if: matrix.flutter-version == '3.47.6'
        working-directory: example
        run: flutter test

      - name: Publish dry run
        if: matrix.flutter-version == '3.47.6'
        shell: bash
        run: |
          set -o pipefail
          flutter pub publish --dry-run 2>&1 | tee "$RUNNER_TEMP/publish.log"
          grep -Fq "Package has 0 warnings." "$RUNNER_TEMP/publish.log"

  sidecar:
    name: MCP sidecar (${{ matrix.flutter-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.32.8', '3.47.6']
    defaults:
      run:
        working-directory: packages/sleuth_mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

  dartdoc:
    name: Dartdoc audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Resolve root dependencies
        run: flutter pub get --no-example

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Resolve MCP package dependencies
        working-directory: packages/sleuth_mcp
        run: dart pub get

      - name: Generate API documentation without unresolved references
        shell: bash
        run: |
          set -o pipefail
          dart doc --dry-run 2>&1 | tee "$RUNNER_TEMP/dartdoc.log"
          grep -Fqx "Found 0 warnings and 0 errors." "$RUNNER_TEMP/dartdoc.log"

  api-diff:
    name: Public API diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.6
          cache: true

      # Compares against the newest stable 1.x or later release on pub.dev.
      # Before 1.0.0 is published there is nothing to compare, and the
      # remaining steps are skipped. A failed or malformed response fails
      # the job instead.
      - name: Find the latest published release
        id: base
        shell: bash
        run: |
          set -euo pipefail
          json=$(curl -fsS https://pub.dev/api/packages/sleuth)
          versions=$(jq -er '.versions[].version' <<<"$json")
          latest=$(grep -E '^[1-9][0-9]*\.[0-9]+\.[0-9]+$' <<<"$versions" \
            | sort -V | tail -n 1 || true)
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Install dart_apitool
        if: steps.base.outputs.version != ''
        run: dart pub global activate dart_apitool 0.23.2

      # package:sleuth/validation.dart is outside the semver promise, so both
      # trees drop it before the diff. Its types that main-API signatures
      # still reach are @experimental, which dart_apitool rates as minor
      # changes, as it does an added enum value. onlyBreakingChanges fails
      # the job on a breaking change without a major version bump and lets
      # a minor change through, so a pull request that adds API does not
      # have to bump the version itself.
      - name: Diff against the published release
        if: steps.base.outputs.version != ''
        shell: bash
        env:
          BASE_VERSION: ${{ steps.base.outputs.version }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/api-diff"
          mkdir -p "$work"
          (cd "$work" && dart pub unpack "sleuth:$BASE_VERSION" --no-resolve)
          old="$work/sleuth-$BASE_VERSION"
          new="$work/new"
          rsync -a --exclude .git --exclude .dart_tool --exclude build \
            --exclude example --exclude packages ./ "$new/"
          rm -f "$old/lib/validation.dart" "$new/lib/validation.dart"
          dart pub global run dart_apitool:main diff \
            --old "$old" --new "$new" --version-check-mode onlyBreakingChanges
